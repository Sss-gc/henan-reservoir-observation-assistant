services:
  web:
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env.production}
      NGINX_ENVSUBST_FILTER: DOMAIN_NAME
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
