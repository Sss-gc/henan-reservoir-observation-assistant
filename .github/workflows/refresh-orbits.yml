name: Refresh satellite observation windows

on:
  schedule:
    - cron: "15 18 * * *"
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-static-orbits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Check whether today's data is already refreshed
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          refresh = True
          if os.environ["EVENT_NAME"] == "schedule":
              data = json.loads(Path("public/data/orbit-passes.json").read_text(encoding="utf-8"))
              generated = datetime.fromisoformat(data["generated_at"])
              refresh = generated.astimezone(ZoneInfo("Asia/Shanghai")).date() != datetime.now(ZoneInfo("Asia/Shanghai")).date()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"refresh={str(refresh).lower()}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.due.outputs.refresh == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-orbit.txt

      - name: Install orbit calculation dependencies
        if: steps.due.outputs.refresh == 'true'
        run: python -m pip install -r backend/requirements-orbit.txt

      - name: Recalculate 30-day full-coverage windows
        if: steps.due.outputs.refresh == 'true'
        env:
          DATABASE_URL: sqlite:///backend/data/github-actions-orbits.db
          SCHEDULER_ENABLED: "false"
        run: python -m backend.app.tasks.export_static_observations --days 30 --force

      - name: Validate generated observations
        if: steps.due.outputs.refresh == 'true'
        run: python scripts/validate_static_observations.py

      - name: Commit refreshed data
        if: steps.due.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/orbit-passes.json
          if git diff --cached --quiet; then
            echo "No orbit data changes"
          else
            git commit -m "data: refresh satellite observation windows"
            git push
          fi
