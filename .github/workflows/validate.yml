name: Validate static observation site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, type-check and build
        run: pnpm test && pnpm typecheck:functions && pnpm build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate static observation data
        run: python scripts/validate_static_observations.py
