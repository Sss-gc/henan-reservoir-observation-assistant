name: Refresh independent mini-program static service

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: miniprogram-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-orbit.txt
      - run: python -m pip install -r backend/requirements-orbit.txt
      - name: Independently generate weather, observations and all Word files
        run: pnpm mini-static:build
      - name: Configure free GitHub Pages hosting
        uses: actions/configure-pages@v5
      - name: Upload one complete independent static version
        uses: actions/upload-pages-artifact@v3
        with:
          path: mini-static/dist
      - name: Publish JSON and all Word files to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
