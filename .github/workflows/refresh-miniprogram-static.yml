name: Refresh independent mini-program static service

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-miniprogram-static.yml'
      - 'scripts/check-mini-static-freshness.mjs'
      - 'scripts/build-mini-static.mjs'
      - 'weather-worker/src/nmc.ts'
  schedule:
    # NMC publishes the morning forecast at about Beijing 08:00. Start at 08:10,
    # then retry every 30 minutes through 10:40; fresh batches exit after the lightweight check.
    - cron: '10,40 0-2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: miniprogram-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check whether today's independent batch needs publishing
        id: due
        run: node scripts/check-mini-static-freshness.mjs
      - uses: pnpm/action-setup@v4
        if: steps.due.outputs.refresh == 'true'
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
        if: steps.due.outputs.refresh == 'true'
      - uses: actions/setup-python@v5
        if: steps.due.outputs.refresh == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-orbit.txt
      - run: python -m pip install -r backend/requirements-orbit.txt
        if: steps.due.outputs.refresh == 'true'
      - name: Independently generate weather, observations and all Word files
        if: steps.due.outputs.refresh == 'true'
        run: pnpm mini-static:build
      - name: Configure free GitHub Pages hosting
        if: steps.due.outputs.refresh == 'true'
        uses: actions/configure-pages@v5
      - name: Upload one complete independent static version
        if: steps.due.outputs.refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mini-static/dist
      - name: Publish JSON and all Word files to GitHub Pages
        if: steps.due.outputs.refresh == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
